version: "2"
sql:
  - engine: "postgresql"
    schema: "db/catalog/migrations"
    queries: "db/catalog/queries"
    gen:
      go:
        package: "db"
        out: "internal/catalog/adapter/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_exact_table_names: false