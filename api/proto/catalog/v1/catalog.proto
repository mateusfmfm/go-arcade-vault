syntax = "proto3";

package catalog.v1;

option go_package = "github.com/mateusfmfm/go-arcade-vault/api/proto/catalog/v1;catalogv1";

service CatalogService {
    rpc ListCabinets(ListCabinetsRequest) returns (ListCabinetsResponse);
    rpc GetCabinet(GetCabinetRequest) returns (GetCabinetResponse);
    rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
    rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
    rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
}

message CabinetImage {
    string id = 1;
    string url = 2;
    string alt = 3;
    int32 sort_order = 4;
}

message Cabinet {
    string id = 1;
    string slug = 2;
    string model = 3;
    string type = 4;
    string display = 5;
    string condition = 6;
    int32 quantity = 7;
    int64 price = 8;
    string manufacturer = 9;
    string year = 10;
    repeated CabinetImage images = 11;
}

message ListCabinetsRequest {}

message ListCabinetsResponse {
    repeated Cabinet cabinets = 1;
}

message GetCabinetRequest {
    string id = 1;
}

message GetCabinetResponse {
    Cabinet cabinet = 1;
}

message ReserveStockRequest {
    string cabinet_id = 1;
    int32 quantity = 2;
    string idempotency_key = 3;
}

message ReserveStockResponse {
    Cabinet cabinet = 1;
    string idempotency_key = 2;
}

message OrderItemInput {
    string cabinet_id = 1;
    int32 quantity = 2;
}

message CreateOrderRequest {
    string idempotency_key = 1;
    repeated OrderItemInput items = 2;
}

message OrderLine {
    string cabinet_id = 1;
    int32 quantity = 2;
    int64 unit_price_cents = 3;
}

message Order {
    string id = 1;
    string user_id = 2;
    string status = 3; // pending_payment | paid | cancelled | failed
    int64 total_cents = 4;
    repeated OrderLine items = 5;
    string idempotency_key = 6; 
}

message CreateOrderResponse {
    Order order = 1;
}

message GetOrderRequest {
    string id = 1;
}

message GetOrderResponse {
    Order order = 1;
}