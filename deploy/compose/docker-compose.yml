services:
  postgres:
    image: postgres:16-alpine
    container_name: arcade_postgres
    environment:
      POSTGRES_USER: arcade_user
      POSTGRES_PASSWORD: arcade_password
      POSTGRES_DB: arcade_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcade_user -d arcade_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: arcade_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 8s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: arcade_jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  migrate:
    profiles: ["migrate"]
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../db/catalog/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database
      - postgres://arcade_user:arcade_password@postgres:5432/arcade_db?sslmode=disable
      - up

  stripe-cli:
    profiles: ["stripe"]
    image: stripe/stripe-cli:v1.19.1
    container_name: arcade_stripe_cli
    command: "listen --forward-to host.docker.internal:8082/webhooks/stripe --api-key ${STRIPE_SECRET_KEY:-sk_test_dummy}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
